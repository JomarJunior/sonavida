name: guard

# Blocks persona definitions, author's notes and vault markers not marked synthetic
# (Principle VIII, spec 003 FR-021). The guard never prints the content it blocks.

on:
  push:
  pull_request:

jobs:
  guard:
    name: Public repository guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned, not main; bump it deliberately.
      - run: pip install "git+https://github.com/JomarJunior/miraveja-persona@596318087c0049370c9af0de1f8c9557b2e79c8a"
      - run: miraveja-persona guard
